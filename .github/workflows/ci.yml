name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # pytest 每个会话重建 clear_complaint_test 并跑 alembic 迁移，需要真实 Postgres
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: clear_complaint
          POSTGRES_PASSWORD: clear_complaint
          POSTGRES_DB: clear_complaint
        options: >-
          --health-cmd "pg_isready -U clear_complaint -d clear_complaint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      # conftest 会重建测试库并跑迁移，Postgres 服务见上方 services。
      - name: Install
        working-directory: backend
        run: uv sync --frozen

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Type check
        working-directory: backend
        run: uv run mypy

      - name: Test
        working-directory: backend
        run: uv run pytest
        env:
          # conftest 的默认值就是它，显式写出来便于和本地区分来源
          TEST_DATABASE_URL: postgresql+asyncpg://clear_complaint:clear_complaint@localhost:5432/clear_complaint_test

  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      # 只跑不花钱的部分：归一化、红旗、引用闸门、指标重算。
      # 真实模型调用与 embedding 都要凭据，永远不进 CI。
      - name: Install
        working-directory: experiment
        run: uv sync --frozen

      - name: Lint
        working-directory: experiment
        run: uv run ruff check .

      - name: Format check
        working-directory: experiment
        run: uv run ruff format --check .

      - name: Type check
        working-directory: experiment
        run: uv run mypy

      - name: Test
        working-directory: experiment
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm type-check

      - name: Build H5
        working-directory: frontend
        run: pnpm build:h5

      - name: Check live interactions
        working-directory: frontend
        run: pnpm check:interactions

      - name: Build WeChat mini program
        working-directory: frontend
        run: pnpm build:mp-weixin
